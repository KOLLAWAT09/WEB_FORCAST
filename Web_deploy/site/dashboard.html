<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forecast Dashboard</title>
  <meta name="description" content="แดชบอร์ดพยากรณ์ราคา เลือกสินทรัพย์ เลือกโมเดล และเปรียบเทียบความแม่นยำ">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M7 21l6-6 4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="index.html">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l5-5 3 3 7-7"/></svg></span>
        Asset Forecast Lab
      </a>
      <nav class="nav">
        <a href="index.html" data-i18n="nav_guide"></a>
        <a href="dashboard.html" aria-current="page" data-i18n="nav_dash"></a>
      </nav>
      <span class="spacer"></span>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="langBtn" data-i18n="lang"></button>
    </div>
  </header>

  <main class="wrap">
    <div class="filters">
      <div class="fgroup"><span class="flabel" data-i18n="f_asset"></span><div class="seg" id="assetSeg" role="group"></div></div>
      <div class="fgroup"><span class="flabel" data-i18n="f_models"></span><div class="chips" id="modelChips" role="group"></div></div>
      <div class="fgroup"><span class="flabel" data-i18n="f_h"></span><div class="seg" id="hSeg" role="group"></div></div>
    </div>

    <div id="status" class="empty" data-i18n="loading"></div>

    <div class="stack" id="content" hidden>
      <div class="tiles" id="tiles"></div>

      <section class="card">
        <div class="card-h">
          <h2 data-i18n="market_chart"></h2><span class="sub" id="marketSub"></span>
          <div class="toolbar">
            <div class="seg" id="rangeSeg"></div>
            <div class="seg" id="typeSeg"></div>
          </div>
        </div>
        <div id="marketChart" class="chart"></div>
      </section>

      <section class="card">
        <div class="card-h"><h2 data-i18n="pred_chart"></h2><span class="sub" data-i18n="pred_sub"></span></div>
        <div class="legend" id="predLegend" style="padding-top:10px"></div>
        <div id="predChart" class="chart tall"></div>
      </section>

      <div class="two">
        <section class="card">
          <div class="card-h"><h2 data-i18n="compare"></h2></div>
          <div class="card-b">
            <p class="muted" style="margin:0 0 8px;font-size:13px" data-i18n="compare_sub"></p>
            <div class="scroll-x"><table class="t" id="metricTable"></table></div>
          </div>
        </section>
        <section class="card">
          <div class="card-h"><h2 data-i18n="err_chart"></h2><span class="sub" data-i18n="err_sub"></span></div>
          <div class="legend" id="errLegend" style="padding-top:10px"></div>
          <div id="errChart" class="chart short"></div>
        </section>
      </div>

      <section class="card">
        <div class="card-h"><h2 data-i18n="future_table"></h2></div>
        <div class="card-b"><div class="scroll-x scroll-y"><table class="t" id="futureTable"></table></div></div>
      </section>

      <section class="card">
        <div class="card-h"><h2 data-i18n="model_info"></h2></div>
        <div class="card-b"><div class="scroll-x"><table class="t" id="infoTable"></table></div>
          <div class="statusbar" id="statusbar"></div>
        </div>
      </section>

      <div class="note"><strong data-i18n="disclaimer_t"></strong> — <span data-i18n="disclaimer"></span></div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/dashboard.js"></script>
</body>
</html>
