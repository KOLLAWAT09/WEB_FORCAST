name: Update forecasts and deploy site

on:
  schedule:
    # 00:30 UTC = 07:30 Thailand, after US/EU closes; Sunday runs also retrain all models.
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      retrain:
        description: 'Retrain all 25 models before predicting'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['Web_deploy/site/**', 'Web_deploy/pipeline/**', '.github/workflows/forecast-site.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forecast-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Web_deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Web_deploy/requirements.txt

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      - name: Restore trained models
        uses: actions/cache/restore@v4
        with:
          path: Web_deploy/artifacts
          key: models-${{ github.run_id }}
          restore-keys: models-

      - name: Fetch latest prices
        run: python -m pipeline.run fetch

      - name: Retrain all models (scheduled Sunday run, or requested)
        if: ${{ inputs.retrain || github.event_name == 'schedule' }}
        env:
          REQUESTED: ${{ inputs.retrain }}
        run: |
          if [ "$REQUESTED" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            python -m pipeline.run train
          else
            echo "Not Sunday: reusing stored models"
          fi

      # Any model missing from the cache (first run, eviction) is trained here automatically.
      - name: Predict and build site data
        run: python -m pipeline.run predict

      - name: Save trained models
        uses: actions/cache/save@v4
        with:
          path: Web_deploy/artifacts
          key: models-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web_deploy/site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
